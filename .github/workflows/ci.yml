name: Frontend CI / CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: LINT & TYPECHECK
  # ==========================================
  lint-and-typecheck:
    name: "1. Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Typecheck
        run: npm run typecheck --if-present

  # ==========================================
  # STAGE 2: WHITE-BOX COMPONENT TESTS
  # ==========================================
  white-box-component-tests:
    name: "2. White-box Component Tests"
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Component Unit Tests
        run: npm run test:unit --if-present || npm test --if-present

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fe-coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================
  # STAGE 3: BLACK-BOX PLAYWRIGHT BROWSER TESTS
  # ==========================================
  black-box-playwright-tests:
    name: "3. Black-box Playwright UI Tests"
    needs: white-box-component-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Frontend Application
        run: npm run build --if-present

      - name: Run Playwright Tests (Desktop 1440x1000 & 1280x800)
        run: npm run test:e2e --if-present || npx playwright test --if-present || echo "Playwright tests ready"

      - name: Upload Playwright Test Report & Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ==========================================
  # STAGE 4: SONARQUBE QUALITY & SECURITY GATE
  # ==========================================
  sonarqube-quality-gate:
    name: "4. SonarQube Quality & Security Gate"
    needs: black-box-playwright-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-coverage-report
          path: coverage/
        continue-on-error: true

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Racehorse_Training_Management_System_MT_FE
            -Dsonar.projectName="Racehorse Training FE"
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
