name: Frontend CI / CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: LINT & TYPECHECK
  # ==========================================
  lint-and-typecheck:
    name: "1. Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

  # ==========================================
  # STAGE 2: BUILD ARTIFACT USED BY BROWSER TESTS
  # ==========================================
  build:
    name: "2. Build Frontend"
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_USE_MOCK: 'true'

      - name: Upload Built Application
        uses: actions/upload-artifact@v4
        with:
          name: fe-built-application
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # STAGE 3: BLACK-BOX PLAYWRIGHT BROWSER TESTS
  # ==========================================
  black-box-playwright-tests:
    name: "3. Black-box Playwright UI Tests"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Download Built Application
        uses: actions/download-artifact@v4
        with:
          name: fe-built-application
          path: dist/

      - name: Run Playwright Tests (Desktop 1440x1000 & 1280x800)
        run: npm run test:e2e

      - name: Upload Playwright Test Report & Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ==========================================
  # STAGE 4: SONARQUBE QUALITY & SECURITY GATE
  # ==========================================
  sonarqube-quality-gate:
    name: "4. SonarQube Quality & Security Gate"
    needs: black-box-playwright-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Racehorse_Training_Management_System_MT_FE
            -Dsonar.projectName="Racehorse Training FE"
            -Dsonar.sources=src
            -Dsonar.tests=tests
